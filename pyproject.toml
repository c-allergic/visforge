[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visforge"
version = "0.1.0"
description = "VisForge: generate questions from images and self-evolve (research skeleton)"
requires-python = ">=3.10"
dependencies = [
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
visforge = "visforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
